            <div class="card">
            <h2>Contact Me</h2>

            <form action="mailto:mohammeddaneyal.mazher@ontariotechu.net" method="post" enctype="text/plain">
                <label for="firstName">First Name *</label>
                <p><input type="text" name="firstName" id="firstName" required minlength="2" placeholder="e.g. John"></p>

                <label for="lastName">Last Name *</label>
                <p><input type="text" name="lastName" id="lastName" required minlength="2" placeholder="e.g. Doe"></p>

                <label for="email">E-mail *</label>
                <p><input type="email" name="email" id="email" required placeholder="e.g. email@email.com"></p>

                <label for="Comments">Comments *</label>
                <p><textarea name="Comments" id="Comments" required minlength="10" placeholder="Write your comments here..."></textarea></p>

                <button type="submit">Submit</button>
